name: Deploy to GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: 'publish-master-pages'
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --outDir docs

      - name: Preserve custom domain
        run: cp CNAME docs/CNAME

      - name: Commit built site to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs
          if ! git diff --cached --quiet; then
            git commit -m 'Build site for GitHub Pages'
            git push origin HEAD:master
          fi

      # GITHUB_TOKEN pushes do not automatically trigger a Pages build.
      - name: Request branch deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pages_config=$(gh api "repos/$GITHUB_REPOSITORY/pages")
          if ! jq -e '.build_type == "legacy" and .source.branch == "master" and .source.path == "/docs"' <<< "$pages_config" > /dev/null; then
            echo '::notice::Site built in master/docs. Set Settings > Pages > Deploy from a branch > master /docs, then run this workflow again.'
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
